# Vigia o site publicado: abre as páginas principais, confere o banco (/saude), pede uma resposta ao
# assistente virtual e confirma que o ERP continua exigindo senha. Se algo falhar, o GitHub manda e-mail ao dono.
#
# O plano grátis do Render "dorme" sem visitas e leva até ~1 minuto para acordar: o script espera até 90 s
# na primeira conferência, e a verificação inteira é repetida uma vez (após 1 minuto) antes de dar falha.
#
# Roda de 2 em 2 horas no horário comercial de Brasília (8h às 20h) e também no botão "Run workflow".
# Para vigiar outro endereço, troque SITE abaixo.
name: monitor

on:
  schedule:
    - cron: "0 11-23/2 * * *" # UTC; equivale a 8h, 10h, 12h, 14h, 16h, 18h e 20h em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://chimarrao-veiculos.onrender.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verificar o site publicado
        run: |
          node app/scripts/smoke.mjs "$SITE" && exit 0
          echo "::warning::Primeira verificação falhou; tentando de novo em 60 s."
          sleep 60
          node app/scripts/smoke.mjs "$SITE"
